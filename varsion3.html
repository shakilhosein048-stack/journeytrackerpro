<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Search UI - Dynamic</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 380px;
        }
        .trip-type {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            padding: 5px 15px;
            margin-bottom: 10px;
            background: #fff;
        }
        .label-text {
            color: #27ae60;
            font-size: 12px;
            display: block;
            margin-top: 5px;
        }
        select {
            width: 100%;
            border: none;
            outline: none;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            background: transparent;
            padding: 5px 0;
            cursor: pointer;
        }
        .swap-icon {
            text-align: center;
            margin: -5px 0;
            color: #1a237e;
            font-size: 24px;
        }
        .date-section {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .search-btn {
            background-color: #009647;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="trip-type">
        <label><input type="radio" name="trip" checked> One Way</label>
        <label style="color: #bdc3c7;"><input type="radio" name="trip"> Round Way</label>
    </div>

    <div class="input-group">
        <span class="label-text">From</span>
        <select id="fromDistrict">
            <option value="">সিলেক্ট করুন</option>
        </select>
    </div>

    <div class="swap-icon">⇌</div>

    <div class="input-group">
        <span class="label-text">To</span>
        <select id="toDistrict">
            <option value="">সিলেক্ট করুন</option>
        </select>
    </div>

    <div class="input-group">
        <div class="date-section">
            <span class="label-text">Journey Date</span>
            <span style="color: #f39c12; font-size: 10px; font-weight: bold;">+ ADD RETURN TRIP</span>
        </div>
        <input type="date" style="width: 100%; border: none; font-size: 16px; font-weight: bold; color: #7f8c8d; outline: none;">
    </div>

    <button class="search-btn">SEARCH</button>
</div>

<script>
    // ৬৪ জেলার ডাটা লিস্ট
    const districts = [
        "ঢাকা (DHA)", "চট্টগ্রাম (CTG)", "গাজীপুর (GZP)", "কক্সবাজার (CXB)", "নারায়ণগঞ্জ (NRJ)", 
        "কুমিল্লা (COM)", "মানিকগঞ্জ (MNK)", "ব্রাহ্মণবাড়িয়া (BRB)", "মুন্সীগঞ্জ (MUN)", "চাঁদপুর (CHA)", 
        "নরসিংদী (NOR)", "নোয়াখালী (NOA)", "ফরিদপুর (FAR)", "ফেনী (FEN)", "মাদারীপুর (MAD)", 
        "লক্ষ্মীপুর (LAK)", "গোপালগঞ্জ (GOP)", "রাঙ্গামাটি (RAN)", "রাজবাড়ী (RAJ)", "খাগড়াছড়ি (KHA)", 
        "শরীয়তপুর (SHA)", "বান্দরবান (BAN)", "কিশোরগঞ্জ (KIS)", "সিলেট (SYL)", "টাঙ্গাইল (TAN)", 
        "মৌলভীবাজার (MOU)", "ময়মনসিংহ (MYM)", "হবিগঞ্জ (HAB)", "জামালপুর (JAM)", "সুনামগঞ্জ (SUN)", 
        "শেরপুর (SHE)", "রাজশাহী (RAJ)", "নেত্রকোনা (NET)", "নাটোর (NAT)", "খুলনা (KHU)", 
        "নওগাঁ (NAU)", "যশোর (JES)", "পাবনা (PAB)", "বাগেরহাট (BAG)", "চাঁপাইনবাবগঞ্জ (CHA)", 
        "সাতক্ষীরা (SAT)", "বগুড়া (BOG)", "কুষ্টিয়া (KUS)", "জয়পুরহাট (JOY)", "মাগুরা (MAG)", 
        "সিরাজগঞ্জ (SIR)", "নড়াইল (NAR)", "রংপুর (RAN)", "ঝিনাইদহ (JHE)", "দিনাজপুর (DIN)", 
        "চুয়াডাঙ্গা (CHU)", "কুড়িগ্রাম (KUR)", "মেহেরপুর (MEH)", "গাইবান্ধা (GAI)", "বরিশাল (BAR)", 
        "নীলফামারী (NIL)", "ভোলা (VHO)", "পঞ্চগড় (PAN)", "পটুয়াখালী (POT)", "ঠাকুরগাঁও (THA)", 
        "পিরোজপুর (PIR)", "লালমনিরহাট (LAL)", "ঝালকাঠি (JHA)", "বরগুনা (BOR)"
    ];

    const fromSelect = document.getElementById('fromDistrict');
    const toSelect = document.getElementById('toDistrict');

    // ড্রপডাউনে জেলাগুলো যোগ করা
    districts.forEach(district => {
        let option1 = document.createElement('option');
        option1.value = district;
        option1.text = district;
        fromSelect.add(option1);

        let option2 = document.createElement('option');
        option2.value = district;
        option2.text = district;
        toSelect.add(option2);
    });
</script>

</body>
</html>
